      <g stroke="#9e9e9e" stroke-width="1.0" stroke-linejoin="round"><polygon points="958.68,108.00 976.00,118.00 976.00,138.00 958.68,128.00" fill="#dfdfdf" /><polygon points="976.00,118.00 993.32,108.00 993.32,128.00 976.00,138.00" fill="#c4c4c4" /><polygon points="976.00,98.00 993.32,108.00 976.00,118.00 958.68,108.00" fill="#ffffff" /></g>
    </g>

    <!-- Callout Annotations -->
    <g font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace' font-size="10" fill="#6b6b6b">
      <text x="1008" y="106" font-weight="700" fill="#000000">L3 // 3D &amp; UI</text>
      <text x="1008" y="121">Next.js · Three.js</text>

      <text x="1014" y="198" font-weight="700" fill="#000000">L2 // AI &amp; API</text>
      <text x="1014" y="213">Node · Gemini · Pub/Sub</text>

      <text x="1014" y="294" font-weight="700" fill="#000000">L1 // DATA &amp; CLOUD</text>
      <text x="1014" y="309">Supabase · PostgreSQL</text>
    </g>
  </g>

</svg>
