<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img">
  <defs>
    <linearGradient id="bg_grad_light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3f3f3" />
      <stop offset="100%" stop-color="#eeeeee" />
    </linearGradient>
    <pattern id="grid_pat_light" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#dedede" stroke-width="0.8" />
    </pattern>
    
  </defs>
  <rect x="1" y="1" width="1198" height="418" rx="16" fill="url(#bg_grad_light)" stroke="#cccccc" stroke-width="1.5" />
  <rect x="2" y="2" width="1196" height="416" rx="15" fill="url(#grid_pat_light)" opacity="0.65" />

  <!-- Left Column: Architectural Identity & Telemetry -->
  <g transform="translate(52, 54)">
