    <polygon points="862.00,162.00 1073.31,284.00 862.00,406.00 650.69,284.00" fill="none" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5 5" />
    <polygon points="862.00,192.00 1021.35,284.00 862.00,376.00 702.65,284.00" fill="none" stroke="#cccccc" stroke-width="1">
