    <line x1="957.26" y1="248.0" x2="957.26" y2="128.0" stroke="#6b6b6b" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.65" />
    <line x1="862.0" y1="248.0" x2="862.0" y2="116.0" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8" />

    <!-- Rising Telemetry Pulses Along Conduits (opacity=0 prevents pre-begin origin artifact) -->
    <circle r="3.2" fill="#059669" opacity="0">
      <animateMotion path="M 766.74,248.0 L 766.74,128.0" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite" />
