      <g stroke="#5c5c5c" stroke-width="1.2" stroke-linejoin="round"><polygon points="813.50,162.00 862.00,190.00 862.00,212.00 813.50,184.00" fill="#1f1f1f" /><polygon points="862.00,190.00 910.50,162.00 910.50,184.00 862.00,212.00" fill="#0a0a0a" /><polygon points="862.00,134.00 910.50,162.00 862.00,190.00 813.50,162.00" fill="#383838" /></g>
