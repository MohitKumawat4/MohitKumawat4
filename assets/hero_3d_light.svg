      <g stroke="#9e9e9e" stroke-width="1.2" stroke-linejoin="round"><polygon points="768.47,120.00 862.00,174.00 862.00,188.00 768.47,134.00" fill="#dfdfdf" /><polygon points="862.00,174.00 955.53,120.00 955.53,134.00 862.00,188.00" fill="#c4c4c4" /><polygon points="862.00,66.00 955.53,120.00 862.00,174.00 768.47,120.00" fill="#ffffff" /></g>
      <g stroke="#5c5c5c" stroke-width="1.1" stroke-linejoin="round"><polygon points="839.48,71.00 862.00,84.00 862.00,108.00 839.48,95.00" fill="#1f1f1f" /><polygon points="862.00,84.00 884.52,71.00 884.52,95.00 862.00,108.00" fill="#0a0a0a" /><polygon points="862.00,58.00 884.52,71.00 862.00,84.00 839.48,71.00" fill="#383838" /></g>
      <g stroke="#9e9e9e" stroke-width="1.1" stroke-linejoin="round"><polygon points="882.78,102.00 905.30,115.00 905.30,133.00 882.78,120.00" fill="#dfdfdf" /><polygon points="905.30,115.00 927.82,102.00 927.82,120.00 905.30,133.00" fill="#c4c4c4" /><polygon points="905.30,89.00 927.82,102.00 905.30,115.00 882.78,102.00" fill="#ffffff" /></g>
      <g stroke="#9e9e9e" stroke-width="1.1" stroke-linejoin="round"><polygon points="796.18,102.00 818.70,115.00 818.70,133.00 796.18,120.00" fill="#dfdfdf" /><polygon points="818.70,115.00 841.22,102.00 841.22,120.00 818.70,133.00" fill="#c4c4c4" /><polygon points="818.70,89.00 841.22,102.00 818.70,115.00 796.18,102.00" fill="#ffffff" /></g>
      <g stroke="#5c5c5c" stroke-width="1.2" stroke-linejoin="round"><polygon points="834.29,112.00 862.00,128.00 862.00,160.00 834.29,144.00" fill="#1f1f1f" /><polygon points="862.00,128.00 889.71,112.00 889.71,144.00 862.00,160.00" fill="#0a0a0a" /><polygon points="862.00,96.00 889.71,112.00 862.00,128.00 834.29,112.00" fill="#383838" /></g>
      <circle cx="862.0" cy="102.0" r="3.5" fill="#059669" />
      <circle cx="862.0" cy="102.0" r="3.5" fill="none" stroke="#059669" stroke-width="1.3">
        <animate attributeName="r" values="3.5;14;3.5" dur="2.6s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.9;0;0.9" dur="2.6s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Floating Satellite Cubes & Layer Callout Labels -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-12; 0,0" dur="3.8s" begin="0.5s" repeatCount="indefinite" />
      <g stroke="#5c5c5c" stroke-width="1.0" stroke-linejoin="round"><polygon points="675.22,168.00 696.00,180.00 696.00,204.00 675.22,192.00" fill="#1f1f1f" /><polygon points="696.00,180.00 716.78,168.00 716.78,192.00 696.00,204.00" fill="#0a0a0a" /><polygon points="696.00,156.00 716.78,168.00 696.00,180.00 675.22,168.00" fill="#383838" /></g>
