      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="5.2s" repeatCount="indefinite" />
      <g stroke="#9e9e9e" stroke-width="1.2" stroke-linejoin="round"><polygon points="714.78,246.00 862.00,331.00 862.00,351.00 714.78,266.00" fill="#dfdfdf" /><polygon points="862.00,331.00 1009.22,246.00 1009.22,266.00 862.00,351.00" fill="#c4c4c4" /><polygon points="862.00,161.00 1009.22,246.00 862.00,331.00 714.78,246.00" fill="#ffffff" /></g>
    </g>

