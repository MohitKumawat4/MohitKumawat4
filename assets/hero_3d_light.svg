    <rect x="0" y="0" width="328" height="30" rx="15" fill="#e6e6e6" stroke="#c8c8c8" stroke-width="1" />
    <circle cx="18" cy="15" r="4.5" fill="#059669">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="18" cy="15" r="4.5" fill="none" stroke="#059669" stroke-width="1.2">
      <animate attributeName="r" values="4.5;10;4.5" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="19.5" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace' font-size="11" font-weight="600" letter-spacing="1.2" fill="#3f3f3f">JAIPUR, IN  //  OPEN TO SELECT BUILDS</text>

    <!-- Name & Role -->
    <text x="0" y="88" font-family='ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="48" font-weight="800" letter-spacing="-1.4" fill="#000000">MOHIT KUMAWAT</text>
    <text x="0" y="122" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace' font-size="14.5" font-weight="600" letter-spacing="0.5" fill="#3f3f3f">FRONT-END &amp; FULL-STACK ENGINEER  ·  3D WEB &amp; AI SYSTEMS</text>

    <!-- Engineering Statement -->
    <text x="0" y="164" font-family='ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" fill="#3f3f3f">Building high-velocity Next.js platforms, interactive Three.js WebGL</text>
    <text x="0" y="186" font-family='ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" fill="#3f3f3f">experiences, real-time AI pipelines, and cloud-native web products.</text>

    <!-- Core Stack Pills -->
    <g transform="translate(0, 214)">
      <rect x="0" y="0" width="96" height="28" rx="6" fill="#000000" />
      <text x="48" y="18" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace' font-size="11.5" font-weight="700" fill="#ffffff">TypeScript</text>

      <rect x="106" y="0" width="92" height="28" rx="6" fill="#000000" />
      <text x="152" y="18" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace' font-size="11.5" font-weight="700" fill="#ffffff">Next.js 16</text>

      <rect x="208" y="0" width="88" height="28" rx="6" fill="#e6e6e6" stroke="#c8c8c8" />
      <text x="252" y="18" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace' font-size="11.5" font-weight="600" fill="#171717">Three.js</text>

      <rect x="306" y="0" width="88" height="28" rx="6" fill="#e6e6e6" stroke="#c8c8c8" />
      <text x="350" y="18" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace' font-size="11.5" font-weight="600" fill="#171717">Supabase</text>

      <rect x="404" y="0" width="92" height="28" rx="6" fill="#e6e6e6" stroke="#c8c8c8" />
      <text x="450" y="18" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace' font-size="11.5" font-weight="600" fill="#171717">Gemini AI</text>
    </g>

    <!-- Telemetry Metrics Strip -->
