name: Refresh 3D Profile Telemetry

on:
  schedule:
    # Regenerate 3D repository cards and contribution skyline every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_profile_svgs.py"
      - ".github/workflows/update_profile_3d.yml"

permissions:
  contents: write

jobs:
  build_and_commit_svgs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate dark and light 3D animated SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PROFILE_TOKEN: ${{ secrets.GH_PROFILE_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/generate_profile_svgs.py

      - name: Commit updated SVG telemetry if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --cached --quiet; then
            echo "No telemetry changes detected."
            exit 0
          fi
          printf '%s\n' \
            "- Refresh 3D codebase scale and Linguist language metrics" \
            "- Sync top recent public repositories and git diff stream" \
            "- Update dark and light monochrome profile SVG assets" | git commit -F -
          git push
